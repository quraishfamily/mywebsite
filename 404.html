<title>404 — الصفحة غير موجودة | أحمد قريش</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-light:#E8C96A;--black:#0A0A0A;--dark:#111111;--dark2:#1A1A1A;--text:#E8E0D0;--text-muted:#888880;--border:rgba(201,168,76,0.2);}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Tajawal',sans-serif;
  background:var(--black);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.bg{
  position:fixed;inset:0;
  background:radial-gradient(ellipse 60% 60% at 50% 50%,rgba(201,168,76,0.06) 0%,transparent 70%);
  pointer-events:none;
}
/* Animated sound waves */
.waves{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:.08;
}
.wave{
  position:absolute;border-radius:50%;
  border:1px solid var(--gold);
  animation:expand 3s ease-out infinite;
}
.wave:nth-child(1){width:200px;height:200px;animation-delay:0s;}
.wave:nth-child(2){width:400px;height:400px;animation-delay:.8s;}
.wave:nth-child(3){width:600px;height:600px;animation-delay:1.6s;}
.wave:nth-child(4){width:800px;height:800px;animation-delay:2.4s;}
@keyframes expand{
  0%{opacity:0;transform:scale(.5);}
  50%{opacity:1;}
  100%{opacity:0;transform:scale(1.5);}
}
.container{
  position:relative;z-index:1;
  text-align:center;padding:2rem;
  max-width:600px;
}
.photo-wrap{
  position:relative;display:inline-block;margin-bottom:2rem;
}
.photo{
  width:120px;height:120px;border-radius:50%;
  object-fit:cover;object-position:top center;
  border:2px solid var(--border);
  filter:grayscale(30%);
}
.photo-wrap::after{
  content:'';position:absolute;inset:-6px;
  border-radius:50%;border:1px solid rgba(201,168,76,0.3);
  animation:rotate 8s linear infinite;
}
@keyframes rotate{to{transform:rotate(360deg);}}
.code{
  font-family:'Cairo',sans-serif;
  font-size:6rem;font-weight:900;
  color:var(--gold);line-height:1;
  margin-bottom:.5rem;
  text-shadow:0 0 60px rgba(201,168,76,0.3);
}
.title{
  font-family:'Cairo',sans-serif;
  font-size:1.5rem;font-weight:700;
  margin-bottom:.8rem;
}
.subtitle{
  font-size:1rem;color:var(--text-muted);
  line-height:1.8;margin-bottom:2.5rem;
  max-width:400px;margin-left:auto;margin-right:auto;
}
.btn{
  display:inline-block;
  padding:.85rem 2.5rem;
  background:var(--gold);color:var(--black);
  font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:700;
  border-radius:4px;text-decoration:none;
  transition:all .3s;margin:.4rem;
}
.btn:hover{background:var(--gold-light);transform:translateY(-2px);}
.btn-outline{
  background:transparent;color:var(--gold);
  border:1px solid var(--gold);
}
.btn-outline:hover{background:rgba(201,168,76,.1);}
.links{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:.5rem;margin-top:2rem;
  border-top:1px solid var(--border);padding-top:1.5rem;
}
.links a{
  font-size:.82rem;color:var(--text-muted);
  text-decoration:none;padding:.3rem .8rem;
  border-radius:100px;border:1px solid var(--border);
  transition:all .3s;
}
.links a:hover{color:var(--gold);border-color:var(--gold);}
.counter{
  font-size:.78rem;color:var(--text-muted);
  margin-top:1.5rem;
}
.counter span{color:var(--gold);font-weight:700;}
</style>
</head>

</div>
