<meta charset="UTF-8">

<title>تفاصيل الدورة | Quraish Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-light:#E8C96A;--black:#0A0A0A;--dark:#111111;--dark2:#1A1A1A;--dark3:#222222;--text:#E8E0D0;--text-muted:#888880;--border:rgba(201,168,76,0.2);}
[data-theme="light"]{--black:#F5F0E8;--dark:#EEEBE3;--dark2:#E8E4DA;--dark3:#DDD9CF;--text:#1A1A1A;--text-muted:#666660;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Tajawal',sans-serif;background:var(--black);color:var(--text);}
nav{position:fixed;top:0;right:0;left:0;z-index:900;padding:1rem 3rem;display:flex;align-items:center;gap:1rem;background:rgba(10,10,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.back-btn{margin-right:auto;font-size:.85rem;color:var(--text-muted);text-decoration:none;transition:color .3s;}
.back-btn:hover{color:var(--gold);}
.theme-btn{width:36px;height:36px;background:var(--dark2);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;}
.main{max-width:1100px;margin:0 auto;padding:7rem 2rem 4rem;}
.course-hero{display:grid;grid-template-columns:1fr 360px;gap:3rem;align-items:start;margin-bottom:3rem;}
.course-img{width:100%;height:260px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block;}
.course-img-placeholder{width:100%;height:260px;background:var(--dark2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:5rem;}
.badge{display:inline-block;background:rgba(201,168,76,.15);color:var(--gold);font-size:.7rem;letter-spacing:2px;font-weight:700;padding:.3rem .9rem;border-radius:100px;margin-bottom:1rem;}
h1{font-family:'Cairo',sans-serif;font-size:clamp(1.8rem,4vw,2.4rem);font-weight:900;margin-bottom:1rem;line-height:1.3;}
.desc{font-size:.92rem;color:var(--text-muted);line-height:1.9;margin-bottom:1.5rem;}
.meta{display:flex;flex-wrap:wrap;gap:.8rem;margin-bottom:1.5rem;}
.meta-item{background:var(--dark2);border:1px solid var(--border);border-radius:4px;padding:.45rem .9rem;font-size:.82rem;color:var(--text-muted);}
.meta-item b{color:var(--text);}
.course-img-wrap{margin-bottom:1.5rem;}
.price-card{background:var(--dark2);border:1px solid var(--border);border-radius:8px;padding:1.8rem;position:sticky;top:5rem;}
.price{font-family:'Cairo',sans-serif;font-size:1.9rem;font-weight:900;color:var(--gold);margin-bottom:.3rem;}
.price-note{font-size:.78rem;color:var(--text-muted);margin-bottom:1.5rem;}
.btn{display:block;width:100%;padding:.85rem;background:var(--gold);color:var(--black);font-family:'Tajawal',sans-serif;font-size:.95rem;font-weight:700;border-radius:4px;text-align:center;text-decoration:none;cursor:pointer;border:none;margin-bottom:.7rem;transition:all .3s;}
.btn:hover{background:var(--gold-light);}
.btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold);}
.btn-outline:hover{background:rgba(201,168,76,.1);}
.features{margin-top:1.5rem;display:flex;flex-direction:column;gap:.6rem;}
.feat{display:flex;gap:.6rem;align-items:center;font-size:.8rem;color:var(--text-muted);}
.feat::before{content:'✓';color:var(--gold);font-weight:700;}
.section{margin-bottom:3rem;}
.sec-title{font-family:'Cairo',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:1.3rem;padding-bottom:.7rem;border-bottom:2px solid var(--border);position:relative;}
.sec-title::after{content:'';position:absolute;bottom:-2px;right:0;width:50px;height:2px;background:var(--gold);}
.outcomes-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
.outcome{background:var(--dark2);border:1px solid var(--border);border-radius:6px;padding:.9rem 1rem;font-size:.87rem;line-height:1.6;display:flex;gap:.7rem;align-items:flex-start;}
.outcome-icon{color:var(--gold);flex-shrink:0;margin-top:.1rem;}
.outline-list{display:flex;flex-direction:column;gap:.6rem;}
.outline-item{background:var(--dark2);border:1px solid var(--border);border-radius:6px;padding:.9rem 1.2rem;display:flex;gap:1rem;align-items:flex-start;}
.outline-num{min-width:30px;height:30px;background:rgba(201,168,76,.15);color:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;}
.outline-text{font-size:.88rem;line-height:1.7;padding-top:.2rem;}
.reg-box{background:var(--dark2);border:1px solid var(--border);border-radius:8px;padding:2rem;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.fg{display:flex;flex-direction:column;gap:.4rem;}
.fg.full{grid-column:1/-1;}
label{font-size:.8rem;color:var(--text-muted);font-weight:600;}
input,textarea,select{background:var(--dark3);border:1px solid var(--border);border-radius:4px;padding:.7rem 1rem;color:var(--text);font-family:'Tajawal',sans-serif;font-size:.88rem;outline:none;transition:border-color .3s;width:100%;}
input:focus,textarea:focus{border-color:var(--gold);}
.reg-btn{margin-top:.5rem;max-width:280px;}
.not-found{text-align:center;padding:5rem 2rem;}
.not-found h2{font-family:'Cairo',sans-serif;color:var(--gold);margin-bottom:1rem;}
@media(max-width:900px){
  nav{padding:1rem 1.5rem;}
  .main{padding:5rem 1.2rem 3rem;}
  .course-hero{grid-template-columns:1fr;}
  .price-card{position:static;}
  .outcomes-grid{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>

  <div id="courseContent"><div style="text-align:center;padding:5rem;color:var(--text-muted);">جارٍ التحميل...</div></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>

var firebaseConfig = {
  apiKey: "AIzaSyBCheHz_5vWYWJdnTpaYstOVKUgvR5tCPQ",
  authDomain: "ahmed-quraish.firebaseapp.com",
  projectId: "ahmed-quraish",
  storageBucket: "ahmed-quraish.firebasestorage.app",
  messagingSenderId: "777596990140",
  appId: "1:777596990140:web:8f336a1f2336a450a416b9"
};
var app = firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var next=cur==='light'?'dark':'light';
  if(next==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeToggle').textContent='☀️';}
  else{document.documentElement.removeAttribute('data-theme');document.getElementById('themeToggle').textContent='🌙';}
  localStorage.setItem('theme',next);
}
document.addEventListener('DOMContentLoaded',function(){
  var s=localStorage.getItem('theme')||'dark';
  if(s==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeToggle').textContent='☀️';}
});

var courseId = new URLSearchParams(window.location.search).get('id');
var currentCourse = null;

async function loadCourse(){
  if(!courseId){showNotFound();return;}
  try{
    var snap = await db.collection('courses').get();
    var courses = snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    var c = courses.find(function(x){return x.id===courseId;});
    if(!c){showNotFound();return;}
    currentCourse = c;
    document.title = c.title+' | Quraish Voice';
    renderCourse(c);
  }catch(e){showNotFound();}
}

function renderCourse(c){
  var imgHtml = c.img
    ? '<img class="course-img" src="'+c.img+'" alt="'+c.title+'">'
    : '<div class="course-img-placeholder">'+(c.icon||'🎓')+'</div>';

  var outcomesHtml = '';
  if(c.outcomes){
    var lines = c.outcomes.split('\n').filter(function(l){return l.trim();});
    if(lines.length){
      outcomesHtml = '<div class="section"><div class="sec-title">ماذا ستتعلم</div><div class="outcomes-grid">'
        +lines.map(function(l){return '<div class="outcome"><span class="outcome-icon">🎯</span><span>'+l.replace(/^[-•*]\s*/,'')+'</span></div>';}).join('')
        +'</div></div>';
    }
  }

  var outlineHtml = '';
  if(c.outline){
    var items = c.outline.split('\n').filter(function(l){return l.trim();});
    if(items.length){
      outlineHtml = '<div class="section"><div class="sec-title">محاور الدورة</div><div class="outline-list">'
        +items.map(function(item,i){return '<div class="outline-item"><div class="outline-num">'+(i+1)+'</div><div class="outline-text">'+item.replace(/^[-•*\d.]+\s*/,'')+'</div></div>';}).join('')
        +'</div></div>';
    }
  }

  var regBtn = c.reglink
    ? '<a href="'+c.reglink+'" target="_blank" class="btn">التسجيل الآن 🎓</a>'
    : '<button class="btn" onclick="scrollToReg()">التسجيل الآن 🎓</button>';

  document.getElementById('courseContent').innerHTML =
    '<div class="course-hero">'
      +'<div>'
        +'<span class="badge">'+(c.badge||'دورة تدريبية')+'</span>'
        +'<h1>'+c.title+'</h1>'
        +'<p class="desc">'+(c.desc||'')+'</p>'
        +'<div class="meta">'
          +'<div class="meta-item">⏱ <b>'+(c.dur||'—')+'</b></div>'
          +'<div class="meta-item">📚 <b>'+(c.sess||'—')+'</b></div>'
          +'<div class="meta-item">👤 <b>'+(c.lvl||'—')+'</b></div>'
        +'</div>'
        +'<div class="course-img-wrap">'+imgHtml+'</div>'
      +'</div>'
      +'<div>'
        +'<div class="price-card">'
          +'<div class="price">'+(c.price||'تواصل معنا')+'</div>'
          +'<p class="price-note">شامل جميع المواد والشهادة</p>'
          +regBtn
          +'<a href="index.html#contact" class="btn btn-outline">استفسر قبل التسجيل</a>'
          +'<div class="features">'
            +'<div class="feat">شهادة حضور معتمدة</div>'
            +'<div class="feat">مواد تدريبية شاملة</div>'
            +'<div class="feat">متابعة بعد الدورة</div>'
            +'<div class="feat">مجموعة واتساب خاصة</div>'
          +'</div>'
        +'</div>'
      +'</div>'
    +'</div>'
    +outcomesHtml
    +outlineHtml
    +'<div class="section" id="reg-section">'
      +'<div class="sec-title">سجّل الآن في '+c.title+'</div>'
      +'<div class="reg-box">'
        +'<form onsubmit="submitReg(event)" style="display:flex;flex-direction:column;gap:.9rem;">'
          +'<div class="form-grid">'
            +'<div class="fg"><label>الاسم الكامل *</label><input type="text" id="reg-name" required placeholder="اسمك الكريم"></div>'
            +'<div class="fg"><label>رقم الجوال *</label><input type="tel" id="reg-phone" required placeholder="+966 5X XXX XXXX"></div>'
            +'<div class="fg"><label>البريد الإلكتروني *</label><input type="email" id="reg-email" required placeholder="email@example.com"></div>'
            +'<div class="fg"><label>ملاحظات</label><textarea id="reg-notes" style="min-height:70px;" placeholder="أي استفسارات..."></textarea></div>'
          +'</div>'
          +'<button type="submit" class="btn reg-btn">إرسال طلب التسجيل 🎓</button>'
        +'</form>'
      +'</div>'
    +'</div>';
}

function scrollToReg(){
  var el=document.getElementById('reg-section');
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}

function showNotFound(){
  document.getElementById('courseContent').innerHTML='<div class="not-found"><h2>الدورة غير موجودة</h2><p style="color:var(--text-muted);margin-bottom:1.5rem;">ربما تم حذف الدورة أو الرابط غير صحيح.</p><a href="index.html#courses" class="btn" style="display:inline-block;width:auto;">← الدورات</a></div>';
}

async function submitReg(e){
  e.preventDefault();
  var name=document.getElementById('reg-name').value;
  var phone=document.getElementById('reg-phone').value;
  var email=document.getElementById('reg-email').value;
  var notes=document.getElementById('reg-notes').value;
  var cName = currentCourse ? currentCourse.title : '';
  db.collection('registrations').add({name:name,phone:phone,email:email,notes:notes,course:cName,time:new Date().toLocaleString('ar-SA')}).catch(function(){});
  try{
    await emailjs.send('service_6g3odwb','t2l4rkn',{
      from_name:name,phone:phone,from_email:email,course:cName,notes:notes||'-',
      subject:'طلب تسجيل — '+cName,time:new Date().toLocaleString('ar-SA')
    },{publicKey:'QnIPBoSRBkpNWiNt4'});
  }catch(err){}
  var btn=e.target.querySelector('button[type=submit]');
  btn.textContent='تم إرسال طلبك! ✓';
  btn.disabled=true;
  e.target.reset();
  setTimeout(function(){btn.textContent='إرسال طلب التسجيل 🎓';btn.disabled=false;},4000);
}

loadCourse();
</script>
</body>
</html>
