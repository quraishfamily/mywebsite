<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأخبار | أحمد قريش</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-light:#E8C96A;--gold-dim:#8B6914;--black:#0A0A0A;--dark:#111111;--dark2:#1A1A1A;--dark3:#222222;--text:#E8E0D0;--text-muted:#888880;--border:rgba(201,168,76,0.2);}
[data-theme="light"]{--black:#F5F0E8;--dark:#EEEBE3;--dark2:#E8E4DA;--dark3:#DDD9CF;--text:#1A1A1A;--text-muted:#666660;--border:rgba(201,168,76,0.3);}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Tajawal',sans-serif;background:var(--black);color:var(--text);min-height:100vh;}
nav{position:fixed;top:0;right:0;left:0;z-index:900;padding:1rem 3rem;display:flex;justify-content:flex-start;align-items:center;gap:1rem;background:rgba(10,10,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-logo{font-family:"Cairo",sans-serif;font-size:1.3rem;font-weight:900;color:var(--gold);text-decoration:none;}
.back-btn{display:flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--text-muted);text-decoration:none;transition:color .3s;margin-right:auto;}
.back-btn:hover{color:var(--gold);}
.main{max-width:780px;margin:0 auto;padding:7rem 2rem 4rem;}
/* HERO IMAGE */
.news-hero-img{
  width:100%;height:380px;object-fit:cover;
  border-radius:6px;margin-bottom:2rem;
  border:1px solid var(--border);
}
.news-hero-placeholder{
  width:100%;height:380px;background:var(--dark2);
  border-radius:6px;margin-bottom:2rem;
  display:flex;align-items:center;justify-content:center;
  font-size:5rem;border:1px solid var(--border);
}
/* META */
.news-meta{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.news-meta .cat{font-size:.72rem;letter-spacing:3px;color:var(--gold);text-transform:uppercase;background:rgba(201,168,76,.1);padding:.3rem .8rem;border-radius:100px;}
.news-meta .date{font-size:.82rem;color:var(--text-muted);}
.news-meta .top-rating{font-size:.82rem;color:var(--gold);display:flex;align-items:center;gap:.3rem;}
.news-meta .top-rating .stars-mini{letter-spacing:1px;}
/* TITLE */
h1{font-family:"Cairo",sans-serif;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:900;line-height:1.4;margin-bottom:1.5rem;}
/* BODY */
.news-content{font-size:1rem;line-height:2;color:var(--text-muted);margin-bottom:2rem;}
.news-content p{margin-bottom:1.2rem;}
/* BODY IMAGES */
.body-img-wrap{margin:2rem 0;}
.body-img-wrap img{width:100%;border-radius:6px;border:1px solid var(--border);display:block;}
.body-img-wrap:has(img + img){display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
/* RATING */
.rating-box{background:var(--dark2);border:1px solid var(--border);border-radius:8px;padding:1.5rem;text-align:center;margin:2rem 0;}
.rating-label{font-size:.85rem;color:var(--text-muted);margin-bottom:.8rem;font-family:"Cairo",sans-serif;font-weight:700;}
.rating-stars{font-size:2rem;display:flex;justify-content:center;gap:.3rem;margin-bottom:.6rem;line-height:1;}
.rate-star{cursor:pointer;color:var(--gold);transition:transform .15s;user-select:none;display:inline-block;}
.rate-star:hover{transform:scale(1.15);}
.rating-stars.voted .rate-star{cursor:default;}
.rating-stars.voted .rate-star:hover{transform:none;}
.rating-info{font-size:.82rem;color:var(--text-muted);}
.rating-thanks{font-size:.8rem;color:var(--gold);margin-top:.4rem;font-weight:700;}
/* DIVIDER */
.divider{height:1px;background:var(--border);margin:2rem 0;}
/* SHARE */
.share-wrap{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:2rem;}
.share-wrap span{font-size:.85rem;color:var(--text-muted);}
.share-link{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.45rem 1rem;border:1px solid var(--border);
  border-radius:100px;font-size:.8rem;color:var(--text-muted);
  text-decoration:none;cursor:pointer;background:transparent;
  transition:all .3s;font-family:"Tajawal",sans-serif;
}
.share-link:hover{border-color:var(--gold);color:var(--gold);}
/* COMMENTS */
.comments-section{margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border);}
.comments-section h3{font-family:"Cairo",sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:1.5rem;}
.comment-item{padding:1rem;background:var(--dark2);border-radius:4px;margin-bottom:.8rem;border:1px solid var(--border);}
.comment-author{font-weight:700;color:var(--gold);font-size:.85rem;margin-bottom:.3rem;}
.comment-text{font-size:.88rem;color:var(--text-muted);line-height:1.7;}
.comment-form{display:flex;gap:.8rem;margin-top:1.5rem;}
.cmt-input{flex:1;background:var(--dark2);border:1px solid var(--border);border-radius:4px;padding:.75rem 1rem;color:var(--text);font-family:"Tajawal",sans-serif;font-size:.9rem;outline:none;transition:border-color .3s;}
.cmt-input:focus{border-color:var(--gold-dim);}
.cmt-send{background:var(--gold);color:var(--black);border:none;padding:.75rem 1.5rem;border-radius:4px;font-family:"Tajawal",sans-serif;font-weight:700;font-size:.88rem;cursor:pointer;transition:background .3s;}
.cmt-send:hover{background:var(--gold-light);}
/* RELATED */
.related-section{margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border);}
.related-section h3{font-family:"Cairo",sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:1.5rem;}
.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.related-card{background:var(--dark2);border:1px solid var(--border);border-radius:4px;overflow:hidden;text-decoration:none;transition:border-color .3s;display:block;}
.related-card:hover{border-color:var(--gold-dim);}
.related-img{height:100px;background:var(--dark3);display:flex;align-items:center;justify-content:center;font-size:2rem;}
.related-info{padding:.8rem;}
.related-info h4{font-size:.85rem;font-weight:700;color:var(--text);margin-bottom:.3rem;line-height:1.4;}
.related-info span{font-size:.72rem;color:var(--text-muted);}
/* LOADING */
.loading{text-align:center;padding:4rem;color:var(--text-muted);}
.not-found{text-align:center;padding:4rem;}
.not-found h2{font-family:"Cairo",sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:1rem;}
.not-found p{color:var(--text-muted);margin-bottom:1.5rem;}
.btn{display:inline-block;padding:.8rem 2rem;background:var(--gold);color:var(--black);font-family:"Tajawal",sans-serif;font-size:.9rem;font-weight:700;border-radius:4px;text-decoration:none;transition:all .3s;}
.btn:hover{background:var(--gold-light);}
/* THEME TOGGLE */
.theme-toggle{margin-right:.5rem;width:36px;height:36px;background:var(--dark2);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;transition:all .3s;}
.theme-toggle:hover{border-color:var(--gold);}
@media(max-width:600px){
  nav{padding:1rem 1.5rem;}
  .main{padding:6rem 1.2rem 3rem;}
  .news-hero-img,.news-hero-placeholder{height:220px;}
  .related-grid{grid-template-columns:1fr;}
  .body-img-wrap:has(img + img){grid-template-columns:1fr;}
}
</style>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBCheHz_5vWYWJdnTpaYstOVKUgvR5tCPQ",
  authDomain: "ahmed-quraish.firebaseapp.com",
  projectId: "ahmed-quraish",

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// THEME
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  if(next==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeToggle').textContent='☀️';}
  else{document.documentElement.removeAttribute('data-theme');document.getElementById('themeToggle').textContent='🌙';}
  localStorage.setItem('theme',next);
}
document.addEventListener('DOMContentLoaded',()=>{
  const saved=localStorage.getItem('theme')||'dark';
  if(saved==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeToggle').textContent='☀️';}
});

// GET NEWS ID FROM URL
const params = new URLSearchParams(window.location.search);
const newsId = params.get('id');

// LOAD NEWS
async function loadNews(){
  if(!newsId){ showNotFound(); return; }
  try {
    // Find the news item from the collection
    const snap = await db.collection('news').get();
    const allNews = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => {
      const ta = b.timestamp || (b.dateRaw ? new Date(b.dateRaw).getTime() : 0);
      const tb = a.timestamp || (a.dateRaw ? new Date(a.dateRaw).getTime() : 0);
      return ta - tb;
    });
    const news = allNews.find(n => n.id === newsId);
    if(!news){ showNotFound(); return; }
    
    // Update page title
    document.title = news.title + ' | أحمد قريش';
    
    // Build page content
    const heroImg = news.img 
      ? `<img src="${news.img}" alt="${news.title}" class="news-hero-img">`
      : `<div class="news-hero-placeholder">${news.icon||'📰'}</div>`;
    
    const bodyImg1 = news.img2 ? `<img src="${news.img2}" alt="">` : '';
    const bodyImg2 = news.img3 ? `<img src="${news.img3}" alt="">` : '';
    const bodyImgs = (bodyImg1||bodyImg2) ? `<div class="body-img-wrap">${bodyImg1}${bodyImg2}</div>` : '';

    document.getElementById('newsContent').innerHTML = `
      ${heroImg}
      <div class="news-meta">
        <span class="cat">${news.cat||news.category||'خبر'}</span>
        <span class="date">📅 ${news.date||''}</span>
        <span class="top-rating" id="top-rating"></span>
      </div>
      <h1>${news.title}</h1>
      <div class="news-content"><p>${(news.body||news.excerpt||'').replace(/\n/g,'</p><p>')}</p></div>
      ${bodyImgs}
      <div class="rating-box" id="rating-box">
        <div class="rating-label">⭐ قيّم هذا المقال</div>
        <div class="rating-stars" id="rating-stars"><span style="font-size:.9rem;color:var(--text-muted);">جارٍ التحميل...</span></div>
      </div>
      <div class="divider"></div>
      <div class="share-wrap">
        <span>شارك:</span>
        <button class="share-link" onclick="window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent('${news.title}'),'_blank')">𝕏 تويتر</button>
        <button class="share-link" onclick="window.open('https://wa.me/?text='+encodeURIComponent('${news.title}+'+location.href),'_blank')">📲 واتساب</button>
        <button class="share-link" onclick="navigator.clipboard.writeText(location.href);this.textContent='تم النسخ ✓'">🔗 نسخ الرابط</button>
      </div>
      <div class="comments-section">
        <h3>💬 التعليقات</h3>
        <div id="comments-list"></div>
        <div class="comment-form">
          <input class="cmt-input" id="cmt-input" placeholder="أضف تعليقك..." onkeydown="if(event.key==='Enter')addComment()">
          <button class="cmt-send" onclick="addComment()">إرسال</button>
        </div>
      </div>
    `;
    
    renderComments();
    loadRelated(news, allNews);
    loadAndRenderRating();
  } catch(e) {
    console.error(e);
    showNotFound();
  }
}

function showNotFound(){
  document.getElementById('newsContent').innerHTML = `
    <div class="not-found">
      <h2>الخبر غير موجود</h2>
      <p>ربما تم حذف هذا الخبر أو الرابط غير صحيح.</p>
      <a href="index.html#news" class="btn">العودة للأخبار</a>
    </div>`;
}

function loadRelated(current, allNews){
  const related = allNews.filter(n => n.id !== current.id).slice(0,3);
  if(!related.length) return;
  const container = document.getElementById('newsContent');
  const relatedHTML = `
    <div class="related-section">
      <h3>أخبار ذات صلة</h3>
      <div class="related-grid">
        ${related.map(n=>`
          <a href="news.html?id=${n.id}" class="related-card">
            <div class="related-img" style="${n.img?'background-image:url('+n.img+');background-size:cover;background-position:center;':''}">
              ${!n.img ? (n.icon||'📰') : ''}
            </div>
            <div class="related-info">
              <h4>${n.title}</h4>
              <span>${n.date||''}</span>
            </div>
          </a>`).join('')}
      </div>
    </div>`;
  container.innerHTML += relatedHTML;
}

// RATING
function ratedKey(){ return 'rated-'+newsId; }

async function loadAndRenderRating(){
  let avg = 0, count = 0;
  try {
    const doc = await db.collection('news').doc(newsId).get();
    const data = doc.data() || {};
    const sum = data.ratingSum || 0;
    count = data.ratingCount || 0;
    avg = count ? (sum / count) : 0;
  } catch(e) { /* keep defaults */ }
  const savedVote = parseInt(localStorage.getItem(ratedKey()) || '0');
  _currentAvg = avg;
  _currentCount = count;
  renderRatingUI(avg, count, savedVote);
}

function renderRatingUI(avg, count, userStars, previewStars){
  const wrap = document.getElementById('rating-stars');
  const box = document.getElementById('rating-box');
  if(!wrap) return;
  const displayStars = previewStars || userStars || Math.round(avg);
  const voted = !!userStars;
  wrap.className = 'rating-stars' + (voted ? ' voted' : '');
  let html = '';
  for(let i=1;i<=5;i++){
    const filled = i <= displayStars;
    html += `<span class="rate-star" data-star="${i}"${voted?'':` onclick="submitRating(${i})" onmouseenter="previewRating(${i})" onmouseleave="previewRating(0)"`}>${filled?'★':'☆'}</span>`;
  }
  wrap.innerHTML = html;
  const infoText = count > 0
    ? `${avg.toFixed(1)} من 5 · ${count} ${count===1?'تقييم':'تقييمات'}`
    : 'كن أول من يقيّم هذا المقال';
  let extra = box.querySelector('.rating-info');
  if(!extra){
    extra = document.createElement('div');
    extra.className = 'rating-info';
    box.appendChild(extra);
  }
  extra.textContent = infoText;
  let thanks = box.querySelector('.rating-thanks');
  if(voted){
    if(!thanks){
      thanks = document.createElement('div');
      thanks.className = 'rating-thanks';
      box.appendChild(thanks);
    }
    thanks.textContent = 'شكراً لتقييمك ✓';
  } else if(thanks){
    thanks.remove();
  }

  // Badge مختصر في أعلى المقال بجانب التصنيف والتاريخ
  const topBadge = document.getElementById('top-rating');
  if(topBadge){
    if(count > 0){
      const rounded = Math.round(avg);
      const starsStr = '★'.repeat(rounded) + '☆'.repeat(5-rounded);
      topBadge.innerHTML = `<span class="stars-mini">${starsStr}</span> ${avg.toFixed(1)} (${count})`;
    } else {
      topBadge.textContent = '';
    }
  }
}

let _currentAvg = 0, _currentCount = 0;
function previewRating(n){
  renderRatingUI(_currentAvg, _currentCount, 0, n);
}

async function submitRating(stars){
  if(localStorage.getItem(ratedKey())) return; // منع التقييم المكرر من نفس الجهاز
  localStorage.setItem(ratedKey(), stars);
  const ref = db.collection('news').doc(newsId);
  try {
    await db.runTransaction(async (t) => {
      const doc = await t.get(ref);
      const data = doc.data() || {};
      const newSum = (data.ratingSum || 0) + stars;
      const newCount = (data.ratingCount || 0) + 1;
      t.update(ref, { ratingSum: newSum, ratingCount: newCount });
    });
  } catch(e) {
    try { await ref.set({ ratingSum: stars, ratingCount: 1 }, { merge: true }); } catch(e2) {}
  }
  const doc = await ref.get();
  const data = doc.data() || {};
  _currentCount = data.ratingCount || 1;
  _currentAvg = _currentCount ? ((data.ratingSum||stars) / _currentCount) : stars;
  renderRatingUI(_currentAvg, _currentCount, stars);
}

// COMMENTS
function renderComments(){
  const list = document.getElementById('comments-list');
  if(!list) return;
  const comments = JSON.parse(localStorage.getItem('cmts-'+newsId)||'[]');
  list.innerHTML = comments.length
    ? comments.map(c=>`<div class="comment-item"><div class="comment-author">زائر</div><div class="comment-text">${c.txt}</div></div>`).join('')
    : '<p style="color:var(--text-muted);font-size:.85rem;margin-bottom:1rem;">لا تعليقات بعد. كن أول من يعلّق!</p>';
}

function addComment(){
  const inp = document.getElementById('cmt-input');
  const txt = inp.value.trim();
  if(!txt) return;
  const comments = JSON.parse(localStorage.getItem('cmts-'+newsId)||'[]');
  comments.push({txt, time: Date.now()});
  localStorage.setItem('cmts-'+newsId, JSON.stringify(comments));
  inp.value = '';
  renderComments();
}

loadNews();
</script>
</body>
