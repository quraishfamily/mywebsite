<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلب تسعيرة تعليق صوتي | Quraish Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{
  --gold:#C9A84C;--gold-light:#E8C96A;--gold-dim:#8B6914;
  --black:#0A0A0A;--dark:#111111;--dark2:#1A1A1A;--dark3:#222222;
  --text:#E8E0D0;--text-muted:#888880;--border:rgba(201,168,76,0.2);
}
[data-theme="light"]{
  --black:#F5F0E8;--dark:#EEEBE3;--dark2:#E8E4DA;--dark3:#DDD9CF;
  --text:#1A1A1A;--text-muted:#666660;--border:rgba(201,168,76,0.3);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Tajawal',sans-serif;background:var(--black);color:var(--text);}
nav{position:fixed;top:0;right:0;left:0;z-index:900;padding:1rem 3rem;display:flex;align-items:center;gap:1rem;background:rgba(10,10,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.back-btn{margin-right:auto;font-size:.85rem;color:var(--text-muted);text-decoration:none;transition:color .3s;}
.back-btn:hover{color:var(--gold);}
.theme-btn{width:36px;height:36px;background:var(--dark2);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;color:var(--text);}
.main{max-width:900px;margin:0 auto;padding:7rem 2rem 5rem;}
.page-header{margin-bottom:3rem;text-align:center;}
.sec-label{font-size:.72rem;letter-spacing:3px;color:var(--gold);font-weight:700;margin-bottom:.6rem;display:block;}
.page-title{font-family:'Cairo',sans-serif;font-size:clamp(1.8rem,4vw,2.4rem);font-weight:900;margin-bottom:.8rem;}
.page-desc{font-size:.92rem;color:var(--text-muted);line-height:1.9;max-width:600px;margin:0 auto;}
.sec-line{width:50px;height:2px;background:var(--gold);margin:.8rem auto 0;}
.form-box{background:var(--dark2);border:1px solid var(--border);border-radius:8px;padding:2.5rem;margin-bottom:3rem;}
.contact-form{display:flex;flex-direction:column;gap:1rem;}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.fg{display:flex;flex-direction:column;gap:.4rem;}
label{font-size:.82rem;color:var(--text-muted);font-weight:600;}
input,textarea,select{background:var(--dark3);border:1px solid var(--border);border-radius:4px;padding:.75rem 1rem;color:var(--text);font-family:'Tajawal',sans-serif;font-size:.9rem;outline:none;transition:border-color .3s;width:100%;}
input:focus,textarea:focus,select:focus{border-color:var(--gold);}
select option{background:var(--dark3);}
textarea{resize:vertical;min-height:100px;}
.btn{display:inline-block;padding:.85rem 2rem;background:var(--gold);color:var(--black);font-family:'Tajawal',sans-serif;font-size:.95rem;font-weight:700;border-radius:4px;border:none;cursor:pointer;transition:all .3s;text-align:center;text-decoration:none;}
.btn:hover{background:#E8C96A;}
.btn-full{width:100%;}
.toast-msg{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--dark2);border:1px solid var(--gold);border-radius:4px;padding:.8rem 1.5rem;font-size:.85rem;color:var(--text);z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast-msg.show{opacity:1;}

/* REVIEWS SECTION */
.reviews-section{margin-top:3rem;}
.reviews-section .sec-header{text-align:center;margin-bottom:2.5rem;}
.reviews-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;margin-bottom:3rem;}
.review-card{background:var(--dark2);border:1px solid var(--border);border-radius:8px;padding:1.5rem;position:relative;}
.review-card::before{content:'';position:absolute;top:0;right:0;width:40%;height:2px;background:linear-gradient(90deg,transparent,var(--gold));}
.review-stars{color:var(--gold);font-size:1.1rem;margin-bottom:.6rem;letter-spacing:2px;}
.review-title{font-weight:700;font-size:.95rem;margin-bottom:.5rem;}
.review-comment{font-size:.85rem;color:var(--text-muted);line-height:1.8;margin-bottom:1rem;}
.review-author{font-size:.78rem;color:var(--gold);font-weight:700;}
.review-type-badge{display:inline-block;font-size:.68rem;padding:.2rem .5rem;background:rgba(201,168,76,.12);border:1px solid var(--border);border-radius:100px;color:var(--text-muted);margin-right:.4rem;}
.rating-avg{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--dark2);border:1px solid var(--border);border-radius:8px;padding:2rem;text-align:center;margin-bottom:2rem;}
.rating-avg .big-num{font-size:3.5rem;font-weight:900;font-family:'Cairo',sans-serif;color:var(--gold);line-height:1;}
.rating-avg .big-stars{font-size:1.4rem;color:var(--gold);margin:.3rem 0;}
.rating-avg .count{font-size:.82rem;color:var(--text-muted);}

/* REVIEW FORM */
.review-form-box{background:var(--dark2);border:1px solid var(--border);border-radius:8px;padding:2.5rem;margin-top:1.5rem;}
.star-input{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:.3rem;margin:.5rem 0;}
.star-input input{display:none;}
.star-input label{font-size:2rem;color:var(--text-muted);cursor:pointer;transition:color .2s;line-height:1;}
.star-input input:checked ~ label,
.star-input label:hover,
.star-input label:hover ~ label{color:var(--gold);}
.pending-msg{background:rgba(201,168,76,.08);border:1px solid var(--border);border-radius:6px;padding:1.2rem 1.5rem;text-align:center;margin-top:1rem;font-size:.9rem;color:var(--text-muted);}
.pending-msg span{color:var(--gold);font-weight:700;}
.no-reviews{text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:.9rem;}

@media(max-width:768px){
  nav{padding:1rem 1.5rem;}
  .main{padding:5rem 1.2rem 4rem;}
  .f-row{grid-template-columns:1fr;}
  .form-box,.review-form-box{padding:1.5rem;}
  .reviews-grid{grid-template-columns:1fr;}
}
</style>
</head>

<!-- REQUEST FORM (hidden in review mode) -->
<div id="request-section">
  <div class="page-header">
    <span class="sec-label">التعليق الصوتي</span>
    <h1 class="page-title">طلب تسعيرة تعليق صوتي</h1>
    <p class="page-desc">أرسل تفاصيل مشروعك وسيتم التواصل معك بأسرع وقت مع تسعيرة مناسبة</p>
    <div class="sec-line"></div>
  </div>
  <div class="form-box">
    <form class="contact-form" onsubmit="submitVO(event)">
      <div class="f-row">
        <div class="fg"><label>الاسم *</label><input type="text" id="vo-name" required placeholder="اسمك الكريم"></div>
        <div class="fg"><label>الجوال *</label><input type="tel" id="vo-phone" required placeholder="+966 5X XXX XXXX"></div>
      </div>
      <div class="fg"><label>البريد الإلكتروني *</label><input type="email" id="vo-email" required placeholder="email@example.com"></div>
      <div class="fg">
        <label>نوع المشروع *</label>
        <select id="vo-type" required>
          <option value="">اختر نوع المشروع...</option>
          <option>إعلان تجاري</option>
          <option>فيلم وثائقي</option>
          <option>مقدمة برنامج</option>
          <option>مقدمة بودكاست</option>
          <option>فيديو تعليمي</option>
          <option>IVR / رد آلي</option>
          <option>كتاب صوتي</option>
          <option>أخرى</option>
        </select>
      </div>
      <div class="f-row">
        <div class="fg">
          <label>الموعد المطلوب للتسليم</label>
          <select id="vo-deadline">
            <option>٣ - ٥ أيام عمل (المعتاد)</option>
            <option>يوم واحد (عاجل)</option>
            <option>أسبوع</option>
            <option>لا يوجد موعد محدد</option>
          </select>
        </div>
        <div class="fg"><label>عدد الكلمات التقريبي</label><input type="number" id="vo-words" placeholder="مثال: 150"></div>
      </div>
      <div class="fg"><label>وصف المشروع *</label><textarea id="vo-desc" required placeholder="اشرح لنا طبيعة المشروع والجمهور المستهدف..." style="min-height:90px;"></textarea></div>
      <div class="fg"><label>السكريبت (النص) — إن وُجد</label><textarea id="vo-script" placeholder="ضع النص المراد تسجيله هنا..." style="min-height:120px;"></textarea></div>
      <div class="fg"><label>ملاحظات إضافية</label><textarea id="vo-notes" placeholder="أي تفاصيل أخرى مهمة..."></textarea></div>
      <button type="submit" class="btn btn-full">إرسال الطلب 🎙️</button>
    </form>
  </div>

  <!-- PUBLISHED REVIEWS -->
  <div class="reviews-section" id="reviews-section" style="display:none;">
    <div class="sec-header">
      <span class="sec-label">آراء العملاء</span>
      <h2 class="page-title" style="font-size:1.8rem;">ماذا قال عملاؤنا</h2>
      <div class="sec-line"></div>
    </div>
    <div class="rating-avg" id="rating-avg-box" style="display:none;">
      <div class="big-num" id="avg-num">0</div>
      <div class="big-stars" id="avg-stars"></div>
      <div class="count" id="avg-count"></div>
    </div>
    <div class="reviews-grid" id="vo-reviews-grid"></div>
  </div>
</div>

<!-- REVIEW FORM (shown when ?review=ID is in URL) -->
<div id="review-section" style="display:none;">
  <div class="page-header">
    <span class="sec-label">تقييم الخدمة</span>
    <h1 class="page-title">قيّم تجربتك معنا</h1>
    <p class="page-desc">رأيك يهمنا ويساعدنا على تحسين خدماتنا</p>
    <div class="sec-line"></div>
  </div>
  <div class="review-form-box">
    <form class="contact-form" onsubmit="submitReview(event)">
      <div class="fg">
        <label>تقييمك *</label>
        <div class="star-input" id="star-input">
          <input type="radio" name="rating" id="s5" value="5"><label for="s5">★</label>
          <input type="radio" name="rating" id="s4" value="4"><label for="s4">★</label>
          <input type="radio" name="rating" id="s3" value="3"><label for="s3">★</label>
          <input type="radio" name="rating" id="s2" value="2"><label for="s2">★</label>
          <input type="radio" name="rating" id="s1" value="1"><label for="s1">★</label>
        </div>
      </div>
      <div class="fg"><label>عنوان التقييم *</label><input type="text" id="rv-title" required placeholder="مثال: تجربة رائعة وصوت احترافي"></div>
      <div class="fg"><label>تعليقك *</label><textarea id="rv-comment" required placeholder="شاركنا تجربتك مع التعليق الصوتي..." style="min-height:120px;"></textarea></div>
      <div class="f-row">
        <div class="fg"><label>اسمك *</label><input type="text" id="rv-name" required placeholder="اسمك أو اسم شركتك"></div>
        <div class="fg"><label>نوع المشروع</label><input type="text" id="rv-project" placeholder="مثال: إعلان تجاري"></div>
      </div>
      <button type="submit" class="btn btn-full">إرسال التقييم ⭐</button>
    </form>
  </div>
</div>

<script>

var firebaseConfig = {
  apiKey: "AIzaSyBCheHz_5vWYWJdnTpaYstOVKUgvR5tCPQ",
  authDomain: "ahmed-quraish.firebaseapp.com",
  projectId: "ahmed-quraish",
  storageBucket: "ahmed-quraish.firebasestorage.app",
  messagingSenderId: "777596990140",
  appId: "1:777596990140:web:8f336a1f2336a450a416b9"
};
var app = firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var next=cur==='light'?'dark':'light';
  if(next==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeToggle').textContent='☀️';}
  else{document.documentElement.removeAttribute('data-theme');document.getElementById('themeToggle').textContent='🌙';}
  localStorage.setItem('theme',next);
}
document.addEventListener('DOMContentLoaded',function(){
  if(localStorage.getItem('theme')==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeToggle').textContent='☀️';}
  checkMode();
  loadApprovedReviews('vo');
});

function showToast(msg,err){
  var t=document.getElementById('toastMsg');
  t.textContent=msg;t.style.borderColor=err?'#cc4444':'var(--gold)';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3500);
}

// Detect mode: review mode or request mode
function checkMode(){
  var params=new URLSearchParams(window.location.search);
  var reviewId=params.get('review');
  if(reviewId){
    document.getElementById('request-section').style.display='none';
    document.getElementById('review-section').style.display='block';
    // Pre-fill project type if passed
    var proj=params.get('project');
    if(proj&&document.getElementById('rv-project'))document.getElementById('rv-project').value=decodeURIComponent(proj);
    // Store request ID
    window._reviewRequestId=reviewId;
    window._reviewType='vo';
  }
}

// Submit voiceover request
async function submitVO(e){
  e.preventDefault();
  var data={
    name:document.getElementById('vo-name').value,
    phone:document.getElementById('vo-phone').value,
    email:document.getElementById('vo-email').value,
    type:document.getElementById('vo-type').value,
    deadline:document.getElementById('vo-deadline').value,
    words:document.getElementById('vo-words').value,
    desc:document.getElementById('vo-desc').value,
    script:document.getElementById('vo-script').value,
    notes:document.getElementById('vo-notes').value,
    time:new Date().toLocaleString('ar-SA')
  };
  db.collection('voiceover_requests').add(data).catch(function(){});
  try{
    await emailjs.send('service_6g3odwb','bozx1s3',{
      from_name:data.name,from_email:data.email,phone:data.phone,
      subject:'طلب تعليق صوتي — '+data.type,
      message:'النوع: '+data.type+'\nالموعد: '+data.deadline+'\nالكلمات: '+data.words+'\nالوصف: '+data.desc+'\nالسكريبت: '+data.script,
      course:data.type,notes:data.notes||'-',time:data.time
    },{publicKey:'QnIPBoSRBkpNWiNt4'});
  }catch(err){}
  showToast('تم إرسال طلبك! سنتواصل معك قريباً بالتسعيرة ✓');
  e.target.reset();
}

// Submit review
async function submitReview(e){
  e.preventDefault();
  var ratingInput=document.querySelector('input[name="rating"]:checked');
  if(!ratingInput){showToast('يرجى اختيار تقييمك بالنجوم ⭐',true);return;}
  var data={
    rating:parseInt(ratingInput.value),
    title:document.getElementById('rv-title').value,
    comment:document.getElementById('rv-comment').value,
    name:document.getElementById('rv-name').value,
    project:document.getElementById('rv-project').value||'',
    type:'vo',
    requestId:window._reviewRequestId||'',
    approved:false,
    time:new Date().toLocaleString('ar-SA'),
    timestamp:Date.now()
  };
  try{
    await db.collection('reviews').add(data);
    document.getElementById('review-section').innerHTML = [
      '<div class="page-header">',
      '<span style="font-size:3rem;">🙏</span>',
      '<h1 class="page-title" style="margin-top:.5rem;">شكراً لتقييمك!</h1>',
      '<p class="page-desc">تم استلام تقييمك وسيظهر على الموقع بعد مراجعته. نقدر وقتك وثقتك.</p>',
      '</div>'
    ].join('');
  }catch(err){
    showToast('حدث خطأ، يرجى المحاولة مجدداً',true);
  }
}

// Load approved reviews and show them
function starsHtml(n){
  var s='';
  for(var i=1;i<=5;i++) s+= i<=n ? '★' : '☆';
  return s;
}

function loadApprovedReviews(type){
  db.collection('reviews').where('type','==',type).where('approved','==',true).get().then(function(snap){
    if(snap.empty)return;
    var reviews=[];
    snap.forEach(function(doc){reviews.push(doc.data());});
    reviews.sort(function(a,b){return (b.timestamp||0)-(a.timestamp||0);});

    // Avg rating
    var total=0;
    reviews.forEach(function(r){total+=r.rating||0;});
    var avg=(total/reviews.length).toFixed(1);
    document.getElementById('avg-num').textContent=avg;
    document.getElementById('avg-stars').textContent=starsHtml(Math.round(avg));
    document.getElementById('avg-count').textContent='بناءً على '+reviews.length+' تقييم';
    document.getElementById('rating-avg-box').style.display='flex';

    // Cards
    var grid=document.getElementById('vo-reviews-grid');
    grid.innerHTML='';
    reviews.forEach(function(r){
      var card=document.createElement('div');
      card.className='review-card';
      card.innerHTML=[
        '<div class="review-stars">'+starsHtml(r.rating||5)+'</div>',
        '<div class="review-title">'+escHtml(r.title||'')+'</div>',
        '<div class="review-comment">'+escHtml(r.comment||'')+'</div>',
        '<div>',
        r.project ? '<span class="review-type-badge">'+escHtml(r.project)+'</span>' : '',
        '<span class="review-author">— '+escHtml(r.name||'عميل')+'</span>',
        '</div>'
      ].join('');
      grid.appendChild(card);
    });
    document.getElementById('reviews-section').style.display='block';
  }).catch(function(){});
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

</script>
</body>
</html>
