<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بودكاست صباحو | Quraish Voice</title>
<meta name="description" content="بودكاست صباحو مع أحمد قريش — حلقات تحفيزية وتطوير ذات بلهجة خليجية ولمسة فكاهية خفيفة">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9A84C;--gold-light:#E8C96A;--gold-dim:#8B6914;
  --black:#0A0A0A;--dark:#111111;--dark2:#1A1A1A;--dark3:#222222;
  --text:#E8E0D0;--text-muted:#888880;--border:rgba(201,168,76,0.2);
}
[data-theme="light"]{
  --black:#F5F0E8;--dark:#EEEBE3;--dark2:#E8E4DA;--dark3:#DDD9CF;
  --text:#1A1A1A;--text-muted:#666660;--border:rgba(201,168,76,0.3);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Tajawal',sans-serif;background:var(--black);color:var(--text);}
nav{position:fixed;top:0;right:0;left:0;z-index:900;padding:1rem 3rem;display:flex;align-items:center;gap:1rem;background:rgba(10,10,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.back-btn{margin-right:auto;font-size:.85rem;color:var(--text-muted);text-decoration:none;transition:color .3s;}
.back-btn:hover{color:var(--gold);}
.theme-btn{width:36px;height:36px;background:var(--dark2);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;color:var(--text);border:none;}
.main{max-width:900px;margin:0 auto;padding:7rem 2rem 5rem;}
.podcast-hero{text-align:center;margin-bottom:3rem;}
.podcast-hero-logo{width:90px;height:90px;border-radius:16px;background:linear-gradient(135deg,var(--gold),var(--dark3));display:flex;align-items:center;justify-content:center;font-size:2.8rem;margin:0 auto 1.2rem;border:1px solid var(--border);}
.sec-label{font-size:.72rem;letter-spacing:3px;color:var(--gold);font-weight:700;margin-bottom:.6rem;text-transform:uppercase;}
.page-title{font-family:'Cairo',sans-serif;font-size:clamp(2rem,5vw,3rem);font-weight:900;margin-bottom:.8rem;}
.page-desc{font-size:.95rem;color:var(--text-muted);line-height:1.9;max-width:550px;margin:0 auto;}
.platform-links{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem;}
.platform-link{padding:.5rem 1.2rem;background:var(--dark2);border:1px solid var(--border);border-radius:100px;font-size:.78rem;color:var(--text-muted);text-decoration:none;transition:all .3s;}
.platform-link:hover{border-color:var(--gold);color:var(--gold);}
.section{margin-bottom:3.5rem;}
.section-title{font-family:'Cairo',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:1.3rem;padding-bottom:.7rem;border-bottom:2px solid var(--border);position:relative;}
.section-title::after{content:'';position:absolute;bottom:-2px;right:0;width:50px;height:2px;background:var(--gold);}
.podcast-grid{display:flex;flex-direction:column;gap:1rem;}
.ep-card{background:var(--dark2);border:1px solid var(--border);border-radius:4px;padding:1.2rem 1.5rem;display:flex;align-items:center;gap:1.5rem;transition:all .3s;cursor:pointer;text-decoration:none;color:var(--text);}
.ep-card:hover{border-color:rgba(201,168,76,.4);}
.ep-num{font-size:1.4rem;font-weight:900;color:#8B6914;font-family:'Cairo',sans-serif;width:50px;text-align:center;flex-shrink:0;}
.ep-info{flex:1;}
.ep-info h4{font-size:.95rem;font-weight:700;margin-bottom:.2rem;}
.ep-meta{display:flex;gap:1rem;font-size:.72rem;color:var(--text-muted);margin-top:.3rem;}
.ep-play{width:40px;height:40px;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0;transition:all .3s;font-size:.9rem;}
.ep-card:hover .ep-play{background:var(--gold);color:var(--black);border-color:var(--gold);}
.sabaho-news-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2rem;}
.sabaho-news-card{background:var(--dark2);border:1px solid var(--border);border-radius:6px;overflow:hidden;text-decoration:none;color:var(--text);transition:all .3s;display:flex;flex-direction:column;}
.sabaho-news-card:hover{border-color:rgba(201,168,76,.4);transform:translateY(-2px);}
.sn-img{width:100%;height:140px;background:linear-gradient(135deg,var(--dark3),var(--dark));display:flex;align-items:center;justify-content:center;font-size:2.5rem;}
.sn-img img{width:100%;height:100%;object-fit:cover;}
.sn-body{padding:1rem 1.2rem;}
.sn-date{font-size:.7rem;color:var(--gold);margin-bottom:.4rem;}
.sn-title{font-size:.9rem;font-weight:700;line-height:1.5;}
.ask-form-box{background:var(--dark2);border:1px solid var(--border);border-radius:8px;padding:2.2rem;}
.contact-form{display:flex;flex-direction:column;gap:1rem;}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.fg{display:flex;flex-direction:column;gap:.4rem;}
label{font-size:.82rem;color:var(--text-muted);font-weight:600;}
input,textarea,select{background:var(--dark3);border:1px solid var(--border);border-radius:4px;padding:.75rem 1rem;color:var(--text);font-family:'Tajawal',sans-serif;font-size:.9rem;outline:none;transition:border-color .3s;width:100%;}
input:focus,textarea:focus,select:focus{border-color:var(--gold);}
textarea{resize:vertical;min-height:100px;}
.btn{display:inline-block;padding:.85rem 2rem;background:var(--gold);color:var(--black);font-family:'Tajawal',sans-serif;font-size:.92rem;font-weight:700;border-radius:4px;border:none;cursor:pointer;transition:all .3s;text-decoration:none;text-align:center;}
.btn:hover{background:#E8C96A;}
.btn-full{width:100%;}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(10px);background:var(--dark2);border:1px solid var(--gold);border-radius:4px;padding:.75rem 1.5rem;font-size:.85rem;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty-msg{text-align:center;padding:2rem;color:var(--text-muted);font-size:.88rem;}
@media(max-width:768px){
  nav{padding:1rem 1.5rem;}
  .main{padding:5rem 1.2rem 4rem;}
  .sabaho-news-grid{grid-template-columns:1fr;}
  .f-row{grid-template-columns:1fr;}
  .ask-form-box{padding:1.5rem;}
}
</style>
</head>

function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var next=cur==='light'?'dark':'light';
  if(next==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeToggle').textContent='☀️';}
  else{document.documentElement.removeAttribute('data-theme');document.getElementById('themeToggle').textContent='🌙';}
  localStorage.setItem('theme',next);
}
document.addEventListener('DOMContentLoaded',function(){
  if(localStorage.getItem('theme')==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeToggle').textContent='☀️';}
});

function showToast(msg,err){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.style.borderColor=err?'#cc4444':'var(--gold)';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3500);
}

var RSS_FEED = 'https://feeds.libsyn.com/565035/rss';

function renderPodcast(eps){
  var grid = document.getElementById('podcastGrid');
  if(!eps || eps==='failed' || eps.length===0){
    grid.innerHTML='<div class="empty-msg">تعذّر تحميل الحلقات تلقائياً<br><a href="https://sabaho.libsyn.com" target="_blank" style="color:var(--gold);">استمع على Libsyn ←</a></div>';
    return;
  }
  grid.innerHTML = eps.slice(0,5).map(function(e,i){
    var epPageLink = 'podcast-episode.html?ep='+i;
    return '<a href="'+epPageLink+'" class="ep-card">'
      +'<div class="ep-num">'+String(i+1).padStart(2,'0')+'</div>'
      +'<div class="ep-info"><h4>'+e.title+'</h4>'
      +'<div class="ep-meta">'+(e.dur?'<span>\u23f1 '+e.dur+'</span>':'')+(e.date?'<span>\ud83d\udcc5 '+e.date+'</span>':'')+'</div></div>'
      +'<div class="ep-play">\u25b6</div>'
      +'</a>';
  }).join('');
}

async function fetchPodcastFromRSS(){
  var months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  function parseEpisode(item,i){
    var d = item.pubDate ? new Date(item.pubDate) : null;
    var dateAr = d ? d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear() : '';
    var dur = item.enclosure && item.enclosure.duration ?
      (parseInt(item.enclosure.duration) > 100 ? Math.floor(parseInt(item.enclosure.duration)/60)+' دقيقة' : item.enclosure.duration+' دقيقة') : '';
    return {title:item.title, dur:dur, date:dateAr, link:item.link||item.guid||'#'};
  }

  try {
    var snap = await db.collection('podcast_episodes').orderBy('order','desc').limit(5).get();
    if(!snap.empty){
      renderPodcast(snap.docs.map(function(d){return d.data();}));
      return;
    }
  } catch(e){}

  try {
    var res = await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(RSS_FEED));
    if(res.ok){
      var data = await res.json();
      if(data.status==='ok' && data.items && data.items.length){
        renderPodcast(data.items.slice(0,5).map(parseEpisode));
        return;
      }
    }
  } catch(e){console.log('RSS fetch error:',e);}

  renderPodcast('failed');
}
fetchPodcastFromRSS();

async function loadSabahoNews(){
  try {
    var snap = await db.collection('news').where('category','==','أخبار صباحو').get();
    if(snap.empty){
      document.getElementById('sabahoNewsGrid').innerHTML='<div class="empty-msg" style="grid-column:1/-1;">لا توجد أخبار حالياً</div>';
      return;
    }
    var news = snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    var now = Date.now();
    news = news.filter(function(n){
      if(!n.status||n.status==='published')return true;
      if(n.status==='draft')return false;
      if(n.status==='scheduled'){
        var t = n.scheduledAt ? new Date(n.scheduledAt).getTime() : 0;
        return t<=now;
      }
      return true;
    });
    news.sort(function(a,b){return (b.timestamp||0)-(a.timestamp||0);});
    if(news.length===0){
      document.getElementById('sabahoNewsGrid').innerHTML='<div class="empty-msg" style="grid-column:1/-1;">لا توجد أخبار حالياً</div>';
      return;
    }
    document.getElementById('sabahoNewsGrid').innerHTML = news.map(function(n){
      var imgHtml = n.img ? '<img src="'+n.img+'" alt="">' : (n.icon||'🎙️');
      var href = n.link || ('news.html?id='+n.id);
      var target = n.link ? ' target="_blank"' : '';
      return '<a href="'+href+'"'+target+' class="sabaho-news-card">'
        +'<div class="sn-img">'+imgHtml+'</div>'
        +'<div class="sn-body"><div class="sn-date">'+(n.date||'')+'</div><div class="sn-title">'+n.title+'</div></div>'
        +'</a>';
    }).join('');
  } catch(e){
    document.getElementById('sabahoNewsGrid').innerHTML='<div class="empty-msg" style="grid-column:1/-1;">فشل التحميل</div>';
  }
}
loadSabahoNews();

async function submitAsk(e){
  e.preventDefault();
  var data = {
    name: document.getElementById('ask-name').value || 'بدون اسم',
    email: document.getElementById('ask-email').value,
    country: document.getElementById('ask-country').value,
    question: document.getElementById('ask-question').value,
    answered: false,
    time: new Date().toLocaleString('ar-SA')
  };
  db.collection('sabaho_questions').add(data).catch(function(){});
  try {
    await emailjs.send('service_6g3odwb','bozx1s3',{
      from_name: data.name,
      from_email: data.email,
      subject: 'سؤال جديد لصباحو',
      message: data.question,
      course: 'اسأل صباحو',
      notes: 'الدولة: '+data.country,
      time: data.time
    },{publicKey:'QnIPBoSRBkpNWiNt4'});
  } catch(err){}
  showToast('تم إرسال سؤالك! شكراً لتفاعلك ✓');
  e.target.reset();
}
</script>
