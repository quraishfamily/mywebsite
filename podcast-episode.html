<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صباحو | حلقة</title>
<meta name="description" content="استمع لحلقة من بودكاست صباحو مع أحمد قريش">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--black:#0A0A0A;--dark:#111;--dark2:#1A1A1A;--dark3:#222;--text:#E8E0D0;--muted:#888880;--border:rgba(201,168,76,0.2);}
[data-theme="light"]{--black:#F5F0E8;--dark:#EEEBE3;--dark2:#E8E4DA;--dark3:#DDD9CF;--text:#1A1A1A;--muted:#666660;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:var(--black);color:var(--text);min-height:100vh;}
nav{position:fixed;top:0;right:0;left:0;z-index:900;padding:1rem 3rem;display:flex;align-items:center;gap:1rem;background:rgba(10,10,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.back-btn{margin-right:auto;font-size:.85rem;color:var(--muted);text-decoration:none;transition:color .3s;}
.back-btn:hover{color:var(--gold);}
.theme-btn{width:36px;height:36px;background:var(--dark2);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;color:var(--text);}
.main{max-width:800px;margin:0 auto;padding:7rem 2rem 5rem;}
.loading{text-align:center;padding:5rem;color:var(--muted);font-size:.9rem;}
.ep-hero{background:var(--dark2);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:2rem;}
.ep-header{background:linear-gradient(135deg,var(--dark3),var(--dark2));padding:2.5rem;display:flex;gap:2rem;align-items:center;}
.ep-artwork{width:120px;height:120px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--dark3));display:flex;align-items:center;justify-content:center;font-size:3rem;flex-shrink:0;border:1px solid var(--border);overflow:hidden;}
.ep-artwork img{width:100%;height:100%;object-fit:cover;}
.ep-meta{flex:1;}
.ep-show{font-size:.72rem;letter-spacing:3px;color:var(--gold);font-weight:700;margin-bottom:.5rem;text-transform:uppercase;}
.ep-title{font-family:'Cairo',sans-serif;font-size:clamp(1.2rem,3vw,1.8rem);font-weight:900;line-height:1.3;margin-bottom:.8rem;}
.ep-info{display:flex;gap:1rem;flex-wrap:wrap;}
.ep-badge{font-size:.75rem;color:var(--muted);background:rgba(255,255,255,.05);padding:.25rem .7rem;border-radius:100px;border:1px solid var(--border);}
.ep-body{padding:2rem 2.5rem;}
.ep-desc{font-size:.92rem;color:var(--muted);line-height:1.9;margin-bottom:2rem;}
.listen-btns{display:flex;gap:.8rem;flex-wrap:wrap;}
.btn-listen{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.5rem;background:var(--gold);color:var(--black);font-family:'Tajawal',sans-serif;font-size:.88rem;font-weight:700;border-radius:4px;text-decoration:none;transition:all .3s;border:none;cursor:pointer;}
.btn-listen:hover{background:#E8C96A;transform:translateY(-2px);}
.btn-share{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.5rem;background:transparent;color:var(--gold);font-family:'Tajawal',sans-serif;font-size:.88rem;font-weight:600;border-radius:4px;border:1px solid var(--border);text-decoration:none;transition:all .3s;cursor:pointer;}
.btn-share:hover{border-color:var(--gold);background:rgba(201,168,76,.05);}
.divider{height:1px;background:var(--border);margin:2rem 0;}
.more-section{margin-top:2rem;}
.more-title{font-family:'Cairo',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:1.2rem;color:var(--gold);}
.ep-list{display:flex;flex-direction:column;gap:.6rem;}
.ep-item{display:flex;align-items:center;gap:1rem;background:var(--dark2);border:1px solid var(--border);border-radius:6px;padding:.9rem 1.2rem;text-decoration:none;color:var(--text);transition:all .3s;cursor:pointer;}
.ep-item:hover{border-color:rgba(201,168,76,.4);background:var(--dark3);}
.ep-item.active{border-color:var(--gold);}
.ep-num-badge{width:36px;height:36px;background:rgba(201,168,76,.1);color:var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;}
.ep-item-title{font-size:.88rem;font-weight:600;line-height:1.4;}
.ep-item-meta{font-size:.75rem;color:var(--muted);margin-top:.2rem;}
.ep-play-icon{margin-right:auto;font-size:.9rem;color:var(--muted);flex-shrink:0;}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(10px);background:var(--dark2);border:1px solid var(--gold);border-radius:4px;padding:.75rem 1.5rem;font-size:.85rem;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:768px){
  nav{padding:1rem 1.5rem;}
  .main{padding:5rem 1rem 4rem;}
  .ep-header{flex-direction:column;align-items:flex-start;padding:1.5rem;gap:1.2rem;}
  .ep-artwork{width:90px;height:90px;font-size:2rem;}
  .ep-body{padding:1.5rem;}
  .listen-btns{flex-direction:column;}
  .btn-listen,.btn-share{width:100%;justify-content:center;}
}
</style>
</head>

<script>
var RSS_FEED = 'https://feeds.libsyn.com/565035/rss';
var params = new URLSearchParams(window.location.search);
var epIndex = parseInt(params.get('ep') || '0');
var allEpisodes = [];

function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'light' ? 'dark' : 'light';
  if(next === 'light'){ document.documentElement.setAttribute('data-theme','light'); document.getElementById('themeToggle').textContent='☀️'; }
  else{ document.documentElement.removeAttribute('data-theme'); document.getElementById('themeToggle').textContent='🌙'; }
  localStorage.setItem('theme', next);
}
document.addEventListener('DOMContentLoaded', function(){
  if(localStorage.getItem('theme')==='light'){ document.documentElement.setAttribute('data-theme','light'); document.getElementById('themeToggle').textContent='☀️'; }
});

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

function copyLink(){
  navigator.clipboard.writeText(window.location.href).then(function(){
    showToast('تم نسخ الرابط! 🔗');
  }).catch(function(){
    showToast('الرابط: ' + window.location.href);
  });
}

function shareWa(){
  var ep = allEpisodes[epIndex];
  var text = 'استمع لحلقة "' + (ep ? ep.title : '') + '" من بودكاست صباحو مع أحمد قريش:\n' + window.location.href;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

function renderEpisode(eps){
  allEpisodes = eps;
  var ep = eps[epIndex];
  if(!ep){
    document.getElementById('epContent').innerHTML = '<div class="loading"><p>الحلقة غير موجودة</p><a href="index.html#podcast" style="color:var(--gold)">← العودة</a></div>';
    return;
  }

  document.title = ep.title + ' | صباحو';

  var moreItems = eps.map(function(e, i){
    return '<div class="ep-item' + (i===epIndex?' active':'') + '" onclick="goToEp(' + i + ')">'
      + '<div class="ep-num-badge">' + (i+1) + '</div>'
      + '<div><div class="ep-item-title">' + e.title + '</div>'
      + '<div class="ep-item-meta">' + (e.dur||'') + ' · ' + (e.date||'') + '</div></div>'
      + '<div class="ep-play-icon">' + (i===epIndex ? '▶' : '') + '</div>'
      + '</div>';
  }).join('');

  document.getElementById('epContent').innerHTML =
    '<div class="ep-hero">'
      + '<div class="ep-header">'
        + '<div class="ep-artwork"><span>🎙️</span></div>'
        + '<div class="ep-meta">'
          + '<div class="ep-show">🎙️ بودكاست صباحو — أحمد قريش</div>'
          + '<h1 class="ep-title">' + ep.title + '</h1>'
          + '<div class="ep-info">'
            + (ep.dur ? '<span class="ep-badge">⏱ ' + ep.dur + '</span>' : '')
            + (ep.date ? '<span class="ep-badge">📅 ' + ep.date + '</span>' : '')
            + '<span class="ep-badge">حلقة ' + (epIndex+1) + '</span>'
          + '</div>'
        + '</div>'
      + '</div>'
      + '<div class="ep-body">'
        + (ep.desc ? '<p class="ep-desc">' + ep.desc + '</p>' : '')
        + '<div class="listen-btns">'
          + (ep.link && ep.link !== '#'
            ? '<a href="' + ep.link + '" target="_blank" class="btn-listen">▶ استمع للحلقة</a>'
            : '<button class="btn-listen" disabled style="opacity:.5;">▶ استمع للحلقة</button>'
          )
          + '<button class="btn-share" onclick="copyLink()">🔗 نسخ الرابط</button>'
          + '<button class="btn-share" onclick="shareWa()">📲 مشاركة واتساب</button>'
        + '</div>'
      + '</div>'
    + '</div>'
    + '<div class="more-section">'
      + '<div class="more-title">حلقات أخرى</div>'
      + '<div class="ep-list">' + moreItems + '</div>'
    + '</div>';
}

function goToEp(i){
  window.location.href = 'podcast-episode.html?ep=' + i;
}

async function loadEpisodes(){
  var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  
  // Try multiple sources
  var proxies = [
    { url: 'https://corsproxy.io/?' + encodeURIComponent(RSS_FEED), type: 'raw' },
    { url: 'https://api.allorigins.win/get?url=' + encodeURIComponent(RSS_FEED), type: 'allorigins' },
    { url: 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RSS_FEED), type: 'rss2json' },
  ];

  // Try rss2json
  try{
    var res = await fetch(proxies[2].url);
    if(res.ok){
      var data = await res.json();
      if(data.status === 'ok' && data.items && data.items.length){
        var eps = data.items.map(function(item){
          var d = item.pubDate ? new Date(item.pubDate) : null;
          var dateAr = d ? d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear() : '';
          var dur = item.enclosure && item.enclosure.duration ?
            (parseInt(item.enclosure.duration) > 100 ? Math.floor(parseInt(item.enclosure.duration)/60)+' دقيقة' : item.enclosure.duration+' دقيقة') : '';
          return { title: item.title, dur: dur, date: dateAr, link: item.link||item.guid||'#', desc: item.description ? item.description.replace(/<[^>]*>/g,'').substring(0,300) : '' };
        });
        renderEpisode(eps);
        return;
      }
    }
  } catch(e) {}

  // Try raw XML
  for(var pi = 0; pi < 2; pi++){
    try{
      var r = await fetch(proxies[pi].url);
      if(!r.ok) continue;
      var text = proxies[pi].type === 'allorigins' ? (await r.json()).contents : await r.text();
      var parser = new DOMParser();
      var xml = parser.parseFromString(text, 'text/xml');
      var items = Array.from(xml.querySelectorAll('item'));
      if(!items.length) continue;
      var eps = items.map(function(item){
        var title = item.querySelector('title') ? item.querySelector('title').textContent : '';
        var pubDate = item.querySelector('pubDate') ? item.querySelector('pubDate').textContent : '';
        var duration = item.querySelector('duration') ? item.querySelector('duration').textContent : '';
        var link = item.querySelector('enclosure') ? item.querySelector('enclosure').getAttribute('url') : (item.querySelector('link') ? item.querySelector('link').textContent : '#');
        var descEl = item.querySelector('description') || item.querySelector('summary');
        var desc = descEl ? descEl.textContent.replace(/<[^>]*>/g,'').substring(0,300) : '';
        var d = pubDate ? new Date(pubDate) : null;
        var dateAr = d ? d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear() : '';
        var durText = duration;
        if(/^\d+$/.test(duration)){ durText = Math.floor(parseInt(duration)/60) + ' دقيقة'; }
        return { title: title, dur: durText, date: dateAr, link: link||'#', desc: desc };
      });
      renderEpisode(eps);
      return;
    } catch(e) { continue; }
  }

  document.getElementById('epContent').innerHTML = '<div class="loading"><p style="color:#cc4444;">فشل تحميل الحلقة. تحقق من اتصالك وحاول مجدداً.</p><a href="index.html#podcast" style="color:var(--gold);">← العودة للبودكاست</a></div>';
}

loadEpisodes();
</script>
</body>
</html>
